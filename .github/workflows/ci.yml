name: CI

# Every push and pull request: run the maths tests and build the site.
# Deploy is done by Cloudflare Workers Builds (connected to this repo): push to main -> live on thalimeter.com.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kitchen maths tests
        run: npm run check
      - name: Build
        run: npm run build
