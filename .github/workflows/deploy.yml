name: CI / Deploy to Hostinger

# Every push and pull request: check data + build.
# Push to main: also upload dist/ to Hostinger by FTPS (only changed files). Cloudflare sits in front (DNS, SSL, cache).
# Repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     e.g. ftp.thalimeter.com   (Hostinger hPanel → Files → FTP Accounts)
#   FTP_USERNAME
#   FTP_PASSWORD
# Optional repository variable: PUBLIC_ADSENSE_CLIENT (set after AdSense approval).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check food data
        run: npm run check
      - name: Build
        run: npm run build
        env:
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
      - name: Upload to Hostinger (only changed files)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
